name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      VP_GIT_HOOKS: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Cache bundled HowMany
        uses: actions/cache@v6.1.0
        with:
          path: resources/howmany
          key: howmany-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('howmany-tool.json', 'setup-howmany.ts') }}
      - run: npm ci --prefer-offline
      - run: npm run setup:howmany
      - run: npm run verify
