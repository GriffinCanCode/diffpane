<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: diffpane-media:; media-src blob: diffpane-media:; frame-src blob:; object-src 'none'; connect-src 'self'"
    />
    <title>Diffpane</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicons/favicon-16.png" />
    <link rel="icon" href="/img/favicons/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
    <link rel="stylesheet" href="/renderer/shell/workspace/theme-tokens.css" />
    <link rel="stylesheet" href="/renderer/shell/workspace/theme.css" />
    <link rel="stylesheet" href="/renderer/shell/recovery/workspace-opening.css" />
  </head>
  <body>
    <section class="workspace-opening" id="workspace-opening" aria-labelledby="workspace-opening-title">
      <div class="workspace-opening__field" aria-hidden="true">
        <span class="workspace-opening__piece workspace-opening__glyph--code">
          <span class="workspace-opening__glyph">&lt;/&gt;</span>
        </span>
        <span class="workspace-opening__piece workspace-opening__glyph--file">
          <span class="workspace-opening__glyph"></span>
        </span>
        <span class="workspace-opening__piece workspace-opening__glyph--diff">
          <span class="workspace-opening__glyph"><span>+</span><span>−</span></span>
        </span>
        <span class="workspace-opening__piece workspace-opening__glyph--branch">
          <span class="workspace-opening__glyph"></span>
        </span>
        <span class="workspace-opening__piece workspace-opening__glyph--prompt">
          <span class="workspace-opening__glyph">›_</span>
        </span>
        <span class="workspace-opening__piece workspace-opening__glyph--commit">
          <span class="workspace-opening__glyph"></span>
        </span>
        <span class="workspace-opening__spark workspace-opening__spark--field-top"></span>
        <span class="workspace-opening__spark workspace-opening__spark--field-right"></span>
        <span class="workspace-opening__spark workspace-opening__spark--field-bottom"></span>
        <span class="workspace-opening__spark workspace-opening__spark--field-left"></span>
      </div>
      <div class="workspace-opening__card">
        <div class="workspace-opening__scene" aria-hidden="true">
          <span class="workspace-opening__shadow"></span>
          <span class="workspace-opening__piece workspace-opening__page--left">
            <span class="workspace-opening__page"></span>
          </span>
          <span class="workspace-opening__piece workspace-opening__page--right">
            <span class="workspace-opening__page"></span>
          </span>
          <span class="workspace-opening__spark workspace-opening__spark--left"></span>
          <span class="workspace-opening__spark workspace-opening__spark--right"></span>
          <span class="workspace-opening__character">
            <span class="window-mascot"><span class="window-mascot__face"></span></span>
          </span>
        </div>
        <h1 id="workspace-opening-title">Opening workspace…</h1>
      </div>
    </section>
    <div id="app" inert></div>
    <script type="module" src="/renderer/shell/workspace/bootstrap.ts"></script>
  </body>
</html>
